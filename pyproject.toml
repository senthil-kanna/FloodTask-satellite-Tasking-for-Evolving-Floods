[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "floodtask"
version = "0.1.0"
description = "Forecast-aware reinforcement learning for multi-pass satellite imaging of evolving floods"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["floodtask*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
