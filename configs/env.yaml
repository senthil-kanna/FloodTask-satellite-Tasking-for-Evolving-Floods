# Tasking environment. Values marked [cal] are set by scripts/calibrate_sim.py on TRAINING events only.
passes: 12                 # observation opportunities per episode
pass_interval_h: 12        # hours between opportunities (multi-mission SAR constellation assumption)
spinup_h: 48               # simulated hours before the first pass (flood already developing)
budget_per_pass: 16        # tiles acquired per pass (of 256)
latency_passes: 0          # extra passes before an acquisition is delivered (0: delivered before next decision)
eval_delay_h: 3            # map product evaluated this many hours after the pass (processing time)
swath_tiles: [8, 16]       # feasible swath width range (tile columns/rows) per pass
full_swath_prob: 0.25      # probability that a pass can see the whole scene
acq_fail_prob: 0.05        # acquisition/downlink/processing failure per tile
nodata_tile_prob: 0.05     # probability a delivered tile has a partial nodata block

physics:                   # per-episode sampling ranges
  runoff_coef: [0.3, 0.7]
  residence_h: [12, 72]
  storm_total_mm: [40, 250]        # [cal] replaced by ERA5-informed range
  n_storms: [1, 4]
  ext_scale: [0.5, 8.0]
  ext_lag_h: [12, 60]
  loss_mm: [0, 0]                  # [cal] bankfull/initial-abstraction storage range

sensor: {}                 # [cal] fitted from U-Net validation-event predictions (results/sensor_model.json)

forecast:
  mode: operational        # operational | accurate | noisy | biased_low | biased_high | displaced | uninformative | missing
  gauge_missing_prob: 0.1
  rain_obs_missing_prob: 0.1
  forecast_missing_prob: 0.05

estimator:                 # shared map estimator (identical for all policies)
  kind: hand_prior         # latest | hand_prior (Bayesian fusion with P(water|HAND); selected on validation)

reward:
  kind: err                # err (cost-weighted error reduction) | iou (pass-level IoU change) | iou_diff (rejected, R12)
  fn_weight: 3.0           # missed-flood cost vs false alarm; selected on validation by R12 (results/reward_validity_val.json)
  unc_coef: 0.0            # weight of uncertainty-reduction bonus (ablation)
